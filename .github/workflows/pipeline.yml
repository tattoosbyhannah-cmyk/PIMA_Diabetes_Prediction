name: MLOps pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'self_paced_courses_1_mlops/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          pip install -r self_paced_courses_1_mlops/deployment/requirements.txt
          pip install huggingface_hub
      - name: Run Unified Pipeline
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: hannahmcowan/PIMA_Diabetes_Prediction
        run: python self_paced_courses_1_mlops/run_pipeline.py
      - name: Commit and Push Model and Data Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add self_paced_courses_1_mlops/data/*.csv self_paced_courses_1_mlops/deployment/model/*.joblib
          git diff --cached --quiet || git commit -m "Update dataset splits and trained model [skip ci]"
          git push
